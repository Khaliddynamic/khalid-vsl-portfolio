<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="scan" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="420" fill="url(#scan)"/>

  <!-- ECG line -->
  <path d="M60 360 H420 L452 360 L470 300 L494 420 L518 360 H700 L732 360 L750 300 L774 420 L798 360 H1220"
        fill="none" stroke="#4d8bd6" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pulse glow -->
  <path d="M420 360 H452 L470 300 L494 420 L518 360 H700 L732 360 L750 300 L774 420 L798 360 H900"
        fill="none" stroke="#0aff9d" stroke-opacity="0.35" stroke-width="22" stroke-linecap="round" filter="url(#blur)"/>

  <!-- crosshair frame -->
  <g stroke="#f2f2f2" stroke-opacity="0.25" stroke-width="2">
    <path d="M0 690 L90 690 M0 30 L14 30"/>
    <path d="M640 0 L640 16 M640 704 L640 720"/>
    <path d="M1190 30 L1280 30 M90 690 L1280 690"/>
  </g>

  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>