<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#2a2233"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0aff9d" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#0aff9d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0aff9d" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- diagonal beam -->
  <path d="M-100 820 L600 40 H760 L60 820 Z" fill="url(#beam)"/>

  <!-- stadium seating bands -->
  <g fill="none" stroke="#f2f2f2" stroke-opacity="0.16" stroke-width="3">
    <path d="M-60 640 C300 470 980 470 1340 640"/>
    <path d="M-60 560 C300 390 980 390 1340 560"/>
  </g>

  <!-- dynamic motion arcs -->
  <g transform="translate(860 210)" stroke="#f2f2f2" stroke-opacity="0.85" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M-60 0 A 60 60 0 0 1 60 0"/>
    <path d="M-90 18 A 90 90 0 0 1 90 18" stroke-opacity="0.5"/>
    <path d="M-40 -60 L40 -60" stroke-opacity="0.4"/>
  </g>

  <g transform="translate(1180 160)" stroke="#0aff9d" stroke-opacity="0.9" stroke-width="6" fill="none" stroke-linecap="round">
    <circle r="34"/>
    <path d="M-18 0 L18 0 M0 -18 L0 18"/>
  </g>

  <rect width="1280" height="720" filter="url(#grain)"/>
</svg>