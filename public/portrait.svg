<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3a3f4a" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#23262e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="1200" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="1200" fill="url(#bg)"/>
    <circle cx="450" cy="470" r="330" fill="url(#glow)"/>

    <!-- Head / shoulders silhouette -->
    <g transform="translate(450 470)" fill="#d9dce2">
      <ellipse cx="0" cy="-150" rx="92" ry="112"/>
      <path d="M-150 210 C-140 40 -60 -70 0 -70 C60 -70 138 40 150 210 C90 250 -90 250 -150 210 Z" fill="#cfd3da"/>
    </g>
    <g transform="translate(450 470)" fill="#0a0a0a" opacity="0.82">
      <ellipse cx="0" cy="-148" rx="92" ry="112" opacity="0.0"/>
    </g>

    <!-- face shadow lines -->
    <g transform="translate(450 470)" stroke="#0a0a0a" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M-28 -170 L-24 -120"/>
      <path d="M10 -178 L8 -126"/>
      <path d="M-62 -90 C-62 -60 -50 -42 -30 -34"/>
      <path d="M56 -84 C58 -56 48 -38 28 -30"/>
    </g>

    <rect x="0" y="0" width="900" height="1200" filter="url(#grain)"/>
  </g>
</svg>